<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eff1e6">
<meta name="robots" content="noindex, nofollow">
<title>合成大香菜</title>
<style>
:root {
  color-scheme: light;
  --bg: #eff1e6;
  --panel: #fafaf2;
  --edge: #d2d9c7;
  --ink: #223326;
  --muted: #506052;
  --mint: #285c3e;
  --peach: #88542c;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100svh; color: var(--ink);
  background: radial-gradient(ellipse at 55% 0%, #e1ead8 0, transparent 55%), var(--bg);
}
button, input { font: inherit; }
button {
  border: 1px solid var(--edge); border-radius: 9px; color: var(--ink);
  background: #f0f3e8; padding: 10px 12px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
button:hover { background: #dfe9d9; border-color: #7f9d83; }
button:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
button.primary { background: var(--mint); color: #fcfff7; border-color: var(--mint); font-weight: 750; }
button.primary:hover { background: #377652; }
[hidden] { display: none !important; }
.shell { max-width: 875px; margin: auto; padding: 32px 22px 28px; }
header { display: flex; align-items: end; justify-content: space-between; gap: 12px; padding-bottom: 19px; }
.brand { display: flex; align-items: center; gap: 14px; }
.emblem { flex: none; width: 39px; height: 39px; position: relative; border-radius: 50%; border: 1px solid #83a385; background: #deead9; }
.emblem::before, .emblem::after { content: ""; position: absolute; background: #39794d; }
.emblem::before { width: 27%; height: 52%; left: 28%; top: 23%; border-radius: 90% 10%; transform: rotate(-25deg); }
.emblem::after { width: 36%; height: 42%; left: 46%; top: 20%; border-radius: 90% 10%; transform: rotate(23deg); }
h1 { margin: 0; font-size: clamp(29px, 5vw, 45px); line-height: 1; letter-spacing: .05em; }
.header-note { color: var(--muted); font-size: 13px; margin: 0 0 2px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 235px; gap: 15px; align-items: start; }
.stage, .tile { border: 1px solid var(--edge); border-radius: 15px; background: var(--panel); }
.stage { padding: 12px; }
.hud { display: flex; justify-content: space-between; gap: 8px; padding: 1px 3px 11px; align-items: center; }
.stats { display: flex; gap: clamp(12px, 4vw, 35px); }
.stat span, .next span { display: block; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
.stat strong { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.12; margin-top: 4px; }
.stat:first-child strong { color: var(--mint); }
.stat .record-flag { display: inline; color: #7a4b22; font-weight: 750; margin-left: 5px; }
.next { display: flex; align-items: center; gap: 5px; }
.next canvas { display: block; width: 38px; height: 38px; }
.next .wind-preview { font-size: 11px; color: #875424; white-space: nowrap; }
#traps { margin: 5px 2px 0; font-size: 12px; font-weight: 650; color: #8b492c; }
.board { position: relative; background: #edf3e9; border: 1px solid #a0b197; border-radius: 10px; overflow: hidden; }
#field { display: block; width: 100%; aspect-ratio: 440 / 478; touch-action: none; cursor: crosshair; }
#field:focus-visible { outline-offset: -4px; }
#field[data-remove] { cursor: cell; }
.board-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
#remove-ticket { font-size: 12px; min-height: 36px; padding: 6px 10px; white-space: nowrap; }
#remove-ticket:disabled { opacity: .52; cursor: default; }
#remove-ticket[aria-pressed="true"] { background: #285c3e; color: #fff; border-color: #285c3e; }
#ticket-progress { font-size: 11px; color: var(--muted); }
.combo {
  position: absolute; top: 11px; right: 11px; z-index: 2; pointer-events: none;
  padding: 7px 11px; border: 1px solid #cfa95a; border-radius: 8px;
  color: #fff2bb; background: #284b34; box-shadow: 0 4px 16px #16291e47;
  font-size: clamp(12px, 3vw, 17px); font-weight: 750; opacity: 0;
}
.combo[data-active] { opacity: 1; animation: combo-pop .28s ease-out both; }
@keyframes combo-pop {
  from { opacity: 0; transform: translateY(7px) scale(.94); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.celebration {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  display: grid; place-items: center; z-index: 1; opacity: 0;
  container-type: inline-size;
}
.celebration::before {
  content: ""; position: absolute; inset: -45%; opacity: .62;
  background: repeating-conic-gradient(from -8deg, #faffcc 0 7deg, transparent 7deg 24deg);
  mask-image: radial-gradient(circle, #000 11%, transparent 47%);
}
.celebration[data-effect] { animation: celebration-fade 2.8s both; }
.celebration[data-effect]::before { animation: celebration-rays 2.8s ease-out both; }
.celebration-card {
  z-index: 1; width: min(94%, 520px); padding: 17px 8px 20px; text-align: center;
  color: #fff8d0; border-block: 2px solid #f4d874;
  background: linear-gradient(90deg, #1d592500, #175238 17%, #19492f 82%, #1d592500);
  filter: drop-shadow(0 8px 12px #293d2455);
}
.celebration[data-effect] .celebration-card { animation: celebration-sweep 2.8s both; }
.celebration[data-effect="gold"] .celebration-card {
  border-color: #ffe29c;
  background: linear-gradient(90deg, #65321300, #613413 13%, #875014 50%, #613413 87%, #65321300);
  filter: drop-shadow(0 0 18px #e7a73ba6);
}
.celebration[data-effect="gold"]::before {
  opacity: .9;
  background: repeating-conic-gradient(from -8deg, #fff3a2 0 9deg, transparent 9deg 22deg);
}
.celebration-title {
  display: block; font-size: clamp(18px, 5.8cqw, 36px); line-height: 1.15;
  font-weight: 900; letter-spacing: .045em; text-shadow: 0 2px 0 #163d24;
}
.celebration-detail { display: block; margin-top: 7px; font-size: 12px; color: #e2efd0; }
@keyframes celebration-fade {
  0%, 100% { opacity: 0; }
  12%, 83% { opacity: 1; }
}
@keyframes celebration-sweep {
  0% { transform: translateX(118%) skewX(-7deg); }
  19%, 80% { transform: translateX(0) skewX(-3deg); }
  100% { transform: translateX(-118%) skewX(-7deg); }
}
@keyframes celebration-rays {
  from { transform: rotate(-22deg) scale(.55); }
  to { transform: rotate(25deg) scale(1.32); }
}
.board-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 2px 0; color: var(--muted); font-size: 12px; }
#coins { color: var(--peach); font-variant-numeric: tabular-nums; white-space: nowrap; }
aside { display: grid; gap: 12px; }
.tile { padding: 15px; }
.tile h2 { font-size: 14px; margin: 0 0 9px; }
.tile p { color: var(--muted); font-size: 12px; line-height: 1.65; margin: 8px 0 0; }
.evolution { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.evolution canvas:last-child { background: #fbefd3; border-color: #d0ab56; }
.evolution canvas { width: 100%; aspect-ratio: 1; min-width: 0; background: #e8efe2; border: 1px solid #d9e2d2; border-radius: 8px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tools button { font-size: 12px; padding: 9px 4px; }
.tools button:first-child { grid-column: 1 / -1; }
kbd { border: 1px solid #acb9a7; padding: 0 4px; border-radius: 3px; font: inherit; white-space: nowrap; }
.keys { color: var(--muted); line-height: 1.7; font-size: 12px; }
dialog {
  color: var(--ink); background: #fafbf3; border: 1px solid #acbca5; border-radius: 16px;
  padding: 22px; width: min(92vw, 390px); max-height: 88dvh; box-shadow: 0 24px 80px #0008;
}
dialog::backdrop { background: #1b2923a8; }
dialog h2 { margin: 0 0 13px; font-size: 23px; }
dialog p { color: var(--muted); line-height: 1.6; }
.dialog-actions { display: flex; flex-wrap: wrap; justify-content: end; gap: 8px; margin-top: 16px; }
#name, #daily-name { width: 100%; border: 1px solid var(--edge); border-radius: 7px; padding: 8px 10px; background: #ffffff; color: var(--ink); margin-top: 6px; }
#rankings { list-style: none; padding: 0; margin: 13px 0 0; }
#rankings li { display: grid; grid-template-columns: 27px 1fr auto; gap: 7px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--edge); font-size: 13px; }
#rankings li span:nth-child(2) { overflow-wrap: anywhere; }
#rankings li strong { color: var(--mint); font-variant-numeric: tabular-nums; }
@media (max-width: 650px) {
  .shell { padding: max(13px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom)); max-width: 498px; }
  header { padding: 0 1px 12px; align-items: center; }
  .brand { gap: 8px; }
  .emblem { width: 29px; height: 29px; }
  .header-note { font-size: 11px; text-align: right; }
  .layout { grid-template-columns: 1fr; gap: 7px; }
  .stage { padding: 7px; border-radius: 11px; }
  .hud { padding: 0 2px 6px; }
  .stat strong { font-size: 19px; margin-top: 2px; }
  .next canvas { width: 32px; height: 32px; }
  .board-meta { padding-top: 6px; font-size: 11px; }
  aside { gap: 7px; }
  .tile { padding: 9px; border-radius: 10px; }
  .tools { order: -1; grid-template-columns: 1.3fr 1fr 1fr; gap: 5px; padding: 5px; }
  .tools button:first-child { grid-column: auto; }
  .evolution canvas { border-radius: 5px; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
  .combo[data-active] { animation: none; }
  .celebration[data-effect] { animation: none; opacity: 1; }
  .celebration[data-effect]::before, .celebration[data-effect] .celebration-card { animation: none; }
}
</style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand"><div class="emblem" aria-hidden="true"></div><h1>合成大香菜</h1></div>
    <p class="header-note">两两相碰，合成香菜</p>
  </header>
  <div class="layout">
    <section class="stage" aria-label="游戏">
      <div class="hud">
        <div class="stats">
          <div class="stat"><span>本局得分</span><strong id="score">0</strong></div>
          <div class="stat"><span>个人纪录<span id="record-flag" class="record-flag" hidden>新纪录</span></span><strong id="best">0</strong></div>
        </div>
        <div class="next"><span>下一个<span id="next-wind" class="wind-preview" hidden></span></span><canvas id="next" width="80" height="80"></canvas></div>
      </div>
      <div class="board">
        <canvas id="field" width="880" height="956" tabindex="0" aria-label="棋盘，方向键瞄准，空格投放" aria-describedby="hint"></canvas>
        <div id="combo" class="combo" role="status" aria-atomic="true"></div>
        <div id="celebration" class="celebration" role="status" aria-atomic="true">
          <div class="celebration-card">
            <strong id="celebration-title" class="celebration-title"></strong>
            <span id="celebration-detail" class="celebration-detail"></span>
          </div>
        </div>
      </div>
      <div class="board-meta">
        <span id="hint" aria-live="polite">拖动瞄准 · 松手投放</span>
        <span id="coins" aria-live="polite">复活币 × 0</span>
      </div>
      <div id="traps" role="status" hidden></div>
      <div class="board-meta board-actions">
        <button id="remove-ticket" type="button" aria-pressed="false" aria-describedby="ticket-progress" disabled>移除券 × 0</button>
        <span id="ticket-progress">每满 300 分送一张</span>
      </div>
    </section>
    <aside aria-label="游戏选项">
      <section class="tile">
        <h2>合成顺序</h2>
        <div id="evolution" class="evolution"></div>
        <p>一次投放接连合成两次以上，可获连锁加分。每 25 投会有一次突击检查，警戒线压低 3 投。每 11 投会吹偏一次，箭头会提前提示方向。两株神·香菜相撞可清屏，每 2,000 分可获得一枚复活币。</p>
      </section>
      <div class="tile tools">
        <button id="daily-mode" type="button" hidden>每日挑战</button>
        <button id="daily-board" type="button" hidden>今日榜</button>
        <button id="show-rank" type="button">本机排行榜</button>
        <button id="sound" type="button" aria-pressed="true">音效开启</button>
        <button id="reset" type="button">重新开始</button>
      </div>
      <div class="tile keys"><kbd>←</kbd> <kbd>→</kbd> 瞄准　<kbd>空格</kbd> 投放</div>
    </aside>
  </div>
</main>
<dialog id="result" aria-labelledby="result-title">
  <h2 id="result-title">本局结束</h2>
  <p id="result-message"></p>
  <div class="dialog-actions">
    <button id="end-rank" type="button">排行榜</button>
    <button id="finish" type="button" hidden>结算</button>
    <button id="revive" class="primary" type="button" hidden>消耗一枚复活币</button>
    <button id="play-again" class="primary" type="button">再来一局</button>
  </div>
</dialog>
<dialog id="rank" aria-labelledby="rank-title">
  <h2 id="rank-title">本机排行榜</h2>
  <label for="name">下局结算昵称</label>
  <input id="name" type="text" maxlength="18" placeholder="香菜路人" autocomplete="off">
  <ol id="rankings"></ol>
  <p id="empty-rank">完成一局后，成绩会显示在这里。</p>
  <form method="dialog" class="dialog-actions"><button class="primary">关闭</button></form>
</dialog>
<dialog id="daily-rank" aria-labelledby="daily-title">
  <h2 id="daily-title">今日同题榜</h2>
  <p id="daily-notice" role="status"></p>
  <label for="daily-name">公开昵称</label>
  <input id="daily-name" type="text" maxlength="18" placeholder="香菜路人" autocomplete="off">
  <ol id="daily-entries"></ol>
  <div class="dialog-actions">
    <button id="daily-start" class="primary" type="button">开始每日挑战</button>
  </div>
  <form method="dialog" class="dialog-actions"><button>关闭</button></form>
</dialog>

const divineLevel = levels.length - 1;
const cilantroLevel = divineLevel - 1;

function loadProfile() {
  const fallback = { name: "", best: 0, scores: [], sound: true };
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (!saved || typeof saved !== "object") return fallback;
    return {
      name: typeof saved.name === "string" ? saved.name.slice(0, 18) : "",
      best: Number.isSafeInteger(saved.best) && saved.best >= 0 ? saved.best : 0,
      scores: Array.isArray(saved.scores) ? saved.scores.filter(entry =>
        entry && typeof entry.name === "string" && Number.isSafeInteger(entry.score) && entry.score >= 0
      ).slice(0, 20) : [],
      sound: saved.sound !== false
    };
  } catch {
    return fallback;
  }
}

const profile = loadProfile();
function saveProfile() {
  try { localStorage.setItem(storageKey, JSON.stringify(profile)); } catch {}
}

function circle(ctx, x, y, radius) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
}

function paintHalo(ctx, radius, time) {
  const pulse = (1 + Math.sin(time * 3.4)) / 2;
  const outer = radius * 1.42;
  const glow = ctx.createRadialGradient(0, 0, radius * .81, 0, 0, outer);
  glow.addColorStop(0, "#fff8c6");
  glow.addColorStop(.43, "#ffce60b3");
  glow.addColorStop(1, "#e8932400");
  circle(ctx, 0, 0, outer);
  ctx.fillStyle = glow;
  ctx.fill();

  circle(ctx, 0, 0, radius * (1.08 + pulse * .05));
  ctx.strokeStyle = "#be761d";
  ctx.lineWidth = Math.max(1, radius * .017);
  ctx.stroke();
  circle(ctx, 0, 0, radius * (1.045 + pulse * .05));
  ctx.strokeStyle = "#fff6b3";
  ctx.lineWidth = Math.max(1, radius * .024);
  ctx.stroke();

  const alpha = ctx.globalAlpha;
  for (let i = 0; i < 8; i++) {
    const angle = i * Math.PI / 4 + time * (i % 2 ? .23 : -.17);
    const gleam = (1 + Math.sin(time * 5 + i * 1.62)) / 2;
    const distance = radius * (i % 2 ? 1.18 : 1.27);
    const x = Math.cos(angle) * distance;
    const y = Math.sin(angle) * distance;
    const size = radius * (.046 + gleam * .058);
    ctx.globalAlpha = alpha * (.48 + gleam * .52);
    ctx.fillStyle = i % 2 ? "#fff8c2" : "#ad6422";
    ctx.beginPath();
    ctx.moveTo(x, y - size);
    ctx.lineTo(x + size * .23, y - size * .23);
    ctx.lineTo(x + size, y);
    ctx.lineTo(x + size * .23, y + size * .23);
    ctx.lineTo(x, y + size);
    ctx.lineTo(x - size * .23, y + size * .23);
    ctx.lineTo(x - size, y);
    ctx.lineTo(x - size * .23, y - size * .23);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = alpha;
}

function paintPiece(ctx, level, x, y, radius, rotation = 0, time = 0) {
  const piece = levels[level];
  const image = sprites[level];
  const r = radius * .98;
  ctx.save();
  ctx.translate(x, y);
  if (level === divineLevel) paintHalo(ctx, radius, reducedMotion ? 0 : time);
  ctx.rotate(rotation);
  circle(ctx, 0, 0, r);
  ctx.fillStyle = "#fafbf6";
  ctx.fill();
  if (image.complete && image.naturalWidth > 0) {
    ctx.save();
    ctx.clip();
    ctx.drawImage(image, -r, -r, r * 2, r * 2);
    ctx.restore();
  }
  ctx.strokeStyle = piece.accent;
  ctx.lineWidth = Math.max(1.05, r * (level === divineLevel ? .058 : .042));
  ctx.stroke();
  ctx.restore();
}

function drawIcon(icon, level) {
  const ctx = icon.getContext("2d");
  const size = icon.width;
  ctx.clearRect(0, 0, size, size);
  paintPiece(ctx, level, size / 2, size / 2, size * (level === divineLevel ? .33 : .43));
}

const guideIcons = levels.map((piece, level) => {
  const icon = document.createElement("canvas");
  icon.width = icon.height = 70;
  const title = (level + 1) + "级 · " + piece.name;
  icon.title = title;
  icon.setAttribute("role", "img");
  icon.setAttribute("aria-label", title);
  $("evolution").append(icon);
  return icon;
});

const sprites = levels.map((piece, level) => {

    drawIcon(guideIcons[level], level);

  });
  image.src = piece.photo ?? levels[cilantroLevel].photo;

guideIcons.forEach(drawIcon);

let audio;
function wakeSound() {
  if (!profile.sound) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    audio ??= new Audio();
    if (audio.state === "suspended") audio.resume().catch(() => {});
  } catch {}
}

function playSound(frequency, time, volume = .07) {
  if (!profile.sound || audio?.state !== "running") return;
  const tone = audio.createOscillator();
  const gain = audio.createGain();
  const now = audio.currentTime;
  tone.type = "sine";
  tone.frequency.setValueAtTime(frequency, now);
  tone.frequency.exponentialRampToValueAtTime(frequency * .66, now + time);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(.001, now + time);
  tone.connect(gain);
  gain.connect(audio.destination);
  tone.start(now);
  tone.stop(now + time);
}

function updateSound() {
  $("sound").textContent = profile.sound ? "音效开启" : "音效关闭";
  $("sound").setAttribute("aria-pressed", String(profile.sound));
}

let balls, particles, score, coins, shownLevel, nextLevel, aim, cooldown, state, drops;
let highestLevel, startingBest, celebrationTimer, comboTimer;
let tickets = 0;
let dailySession = null;
let dailyDraw = 0;
let roundTick = 0;
let removalMode = false;
let removalTarget = null;
const celebrationQueue = [];
let playerId = null;
let previous = 0;
let accumulator = 0;
const number = new Intl.NumberFormat("zh-CN");

function dailyPiece(seed, index, levelCount) {
  let number = (seed + Math.imul(index + 1, 0x9e3779b9)) >>> 0;
  number = Math.imul(number ^ (number >>> 16), 0x21f0aaad);
  number = Math.imul(number ^ (number >>> 15), 0x735a2d97);
  const value = ((number ^ (number >>> 15)) >>> 0) / 0x100000000;
  const top = Math.min(3 + Math.floor(index / 36), levelCount - 4);
  if (top === 3) {
    if (value < .36) return 0;
    if (value < .65) return 1;
    return value < .86 ? 2 : 3;
  }
  if (value < .18) return top - 3;
  if (value < .40) return top - 2;
  return value < .70 ? top - 1 : top;
}

function randomLevel() {
  if (dailySession) return dailyPiece(dailySession.seed, dailyDraw++, levels.length);
  const value = Math.random();
  const highestDrop = clamp(highestLevel - 2, 3, levels.length - 4);
  if (highestDrop === 3) {
    if (value < .36) return 0;
    if (value < .65) return 1;
    if (value < .86) return 2;
    return 3;
  }
  if (value < .18) return highestDrop - 3;
  if (value < .40) return highestDrop - 2;
  if (value < .70) return highestDrop - 1;
  return highestDrop;
}

function inspectionRemaining(count) {
  return count >= 25 ? Math.max(0, 3 - (count % 25)) : 0;
}

function dangerLine(count) {
  return line + (inspectionRemaining(count) > 0 ? 16 : 0);
}

function windAt(throwNumber) {
  if (throwNumber % 11 !== 0) return 0;
  return throwNumber % 22 === 0 ? 12 : -12;
}

function updateDropPreview() {
  drawIcon(nextCanvas, nextLevel);
  const preview = $("next-wind");
  const nextWind = windAt(drops + 2);
  preview.hidden = nextWind === 0;
  preview.textContent = nextWind < 0 ? "← 左偏" : "→ 右偏";
  nextCanvas.setAttribute("aria-label", "下一个：" + levels[nextLevel].name + (nextWind ? "，" + preview.textContent : ""));
  const notices = [];
  const approaching = (drops + 1) % 25 === 0;
  const remaining = inspectionRemaining(drops);
  const wind = windAt(drops + 1);
  if (approaching) notices.push("下一投触发突击检查");
  if (remaining > 0) notices.push("突击检查 · 警戒线压低");
  if (wind) notices.push(wind < 0 ? "这颗会向左吹偏" : "这颗会向右吹偏");
  $("traps").textContent = notices.join("　·　");
  $("traps").hidden = notices.length === 0;
}

function updateHud() {
  $("score").textContent = number.format(score);
  $("best").textContent = number.format(profile.best);
  $("record-flag").hidden = startingBest === 0 || score <= startingBest;
  $("coins").textContent = "复活币 × " + coins;
  updateRemovalControl();
}

function updateRemovalControl() {
  ticketButton.textContent = (removalMode ? "取消选择" : "移除券 × " + tickets);
  ticketButton.disabled = !removalMode && (state !== "playing" || tickets === 0 || balls.length === 0);
  ticketButton.setAttribute("aria-pressed", String(removalMode));
  $("ticket-progress").textContent = removalMode ? "方向键选角色，空格确认" :
    "下张移除券：" + number.format((Math.floor(score / ticketInterval) + 1) * ticketInterval) + " 分";
}

function setRemovalMode(active) {
  removalMode = active;
  removalTarget = active ? balls.reduce((top, ball) => ball.y < top.y ? ball : top) : null;
  if (active) {
    canvas.setAttribute("data-remove", "");
    canvas.focus({ preventScroll: true });
  } else {
    canvas.removeAttribute("data-remove");
  }
  $("hint").textContent = active ? "点一个角色移除，也可再次点按钮取消" : "拖动瞄准 · 松手投放";
  updateRemovalControl();
}

function removePiece(ball) {
  if (!removalMode || !ball || tickets === 0) return;
  const index = balls.indexOf(ball);
  if (index < 0) return;
  recordDailyAction("t", index);
  balls.splice(index, 1);
  tickets--;
  burst(ball.x, ball.y, levels[ball.level].accent, 16);
  setRemovalMode(false);
  playSound(610, .18);
}

function selectRemovalTarget(offset) {
  const ordered = [...balls].sort((a, b) => a.x - b.x || a.y - b.y);
  const index = ordered.indexOf(removalTarget);
  removalTarget = index < 0 ? ordered[0] : ordered[(index + offset + ordered.length) % ordered.length];
}

function reset() {
  if (result.open) result.close();
  balls = [];
  particles = [];
  score = coins = tickets = cooldown = drops = 0;
  roundTick = dailyDraw = 0;
  highestLevel = 0;
  startingBest = profile.best;
  clearTimeout(celebrationTimer);
  clearTimeout(comboTimer);
  hideCombo();
  celebrationQueue.length = 0;
  hideCelebration();
  shownLevel = randomLevel();
  nextLevel = randomLevel();
  aim = width / 2;
  state = "playing";
  playerId = null;
  setRemovalMode(false);
  updateHud();
  updateDropPreview();
}

function addScore(points) {
  coins += Math.floor((score + points) / reviveInterval) - Math.floor(score / reviveInterval);
  tickets += Math.floor((score + points) / ticketInterval) - Math.floor(score / ticketInterval);
  score += points;
  if (!isDailyMode() && score > profile.best) {
    profile.best = score;
    saveProfile();
  }
  updateHud();
}

function makeBall(level, x, y, vx = 0, vy = 0) {
  const radius = levels[level].radius;
  return {
    level, x, y, vx, vy, radius, invMass: 1 / (radius * radius),
    rotation: (Math.random() - .5) * .22, spin: 0, age: 0, danger: 0,
    contacted: false, dead: false, chain: null
  };
}

function drop() {
  if (state !== "playing" || rank.open || removalMode || cooldown > 0) return;
  wakeSound();
  if (isDailyMode()) aim = Math.round(clamp(aim, 0, width) * 100) / 100;
  recordDailyAction("d", Math.round(aim * 100));
  const radius = levels[shownLevel].radius;
  const ball = makeBall(shownLevel, clamp(aim + windAt(drops + 1), left + radius, right - radius), Math.max(spawnY, radius + 3), 0, 42);
  ball.chain = { drop: ++drops, count: 0 };
  balls.push(ball);
  shownLevel = nextLevel;
  nextLevel = randomLevel();
  updateDropPreview();
  cooldown = .32;
  updateRemovalControl();
  playSound(225, .10, .035);
}

function burst(x, y, color, size) {
  if (reducedMotion) return;
  for (let i = 0; i < size; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const speed = 26 + Math.random() * 120;
    const life = .35 + Math.random() * .36;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life, max: life, color });
  }
}

function hideCelebration() {
  celebrationTimer = undefined;
  celebration.removeAttribute("data-effect");
  $("celebration-title").textContent = "";
  $("celebration-detail").textContent = "";
}

function playNextCelebration() {
  const { title, detail, effect } = celebrationQueue.shift();
  $("celebration-title").textContent = title;
  $("celebration-detail").textContent = detail;
  void celebration.offsetWidth;
  celebration.setAttribute("data-effect", effect);
  celebrationTimer = setTimeout(() => {
    hideCelebration();
    if (celebrationQueue.length > 0) playNextCelebration();
  }, 2800);
}

function celebrate(title, detail, effect = "green") {
  celebrationQueue.push({ title, detail, effect });
  if (celebrationTimer === undefined) playNextCelebration();
}

function hideCombo() {
  comboIndicator.removeAttribute("data-active");
  comboIndicator.textContent = "";
}

function showCombo(count, bonus) {
  clearTimeout(comboTimer);
  hideCombo();
  comboIndicator.textContent = count + " 连锁 · +" + bonus + " 分";
  void comboIndicator.offsetWidth;
  comboIndicator.setAttribute("data-active", "");
  comboTimer = setTimeout(hideCombo, 1400);
}

function mergeChain(a, b) {
  // Expired pieces can still merge, but they no longer belong to a recent drop.
  const first = a.age <= 1.65 ? a.chain : null;
  const second = b.age <= 1.65 ? b.chain : null;
  if (!first && !second) return null;
  const source = !second || (first && first.drop > second.drop) ? first : second;
  return { drop: source.drop, count: source.count + 1 };
}

function clearBoard(x, y, comboBonus) {
  const stride = Math.max(1, Math.ceil(balls.length / 18));
  balls.forEach((ball, index) => {
    if (index % stride === 0) burst(ball.x, ball.y, levels[ball.level].accent, 7);
  });
  balls.length = 0;
  cooldown = Math.max(cooldown, .55);
  coins++;
  addScore(finalPairPoints + comboBonus);
  burst(x, y, "#6b9b42", 38);
  celebrate("双神·香菜 · 全场清空", "+500 分 · +1 复活币 · 本局继续", "gold");
  playSound(850, .34, .13);
}

function merge(a, b) {
  a.dead = b.dead = true;
  const x = (a.x + b.x) / 2;
  const y = (a.y + b.y) / 2;
  const level = a.level + 1;
  const chain = mergeChain(a, b);
  const comboBonus = chain ? Math.min(24, (chain.count - 1) * 3) : 0;
  if (comboBonus > 0) showCombo(chain.count, comboBonus);
  if (level === levels.length) {
    clearBoard(x, y, comboBonus);
    return true;
  }
  const merged = makeBall(level, x, y, (a.vx + b.vx) * .28, Math.min(10, (a.vy + b.vy) * .28));
  merged.contacted = true;
  merged.age = .34;
  merged.chain = chain;
  balls.push(merged);
  highestLevel = Math.max(highestLevel, level);
  addScore(levels[level].points + comboBonus);
  if (level === cilantroLevel) {
    celebrate("香菜觉得你很不错哦", "两株香菜可合成神·香菜");
  } else if (level === divineLevel) {
    celebrate("你得到了香菜的青睐", "神·香菜降临", "gold");
    burst(x, y, "#ffd768", 40);
    playSound(1140, .34);
  }
  burst(x, y, levels[level].accent, level >= cilantroLevel ? 48 : 14);
  playSound(400 + level * 54, .17);
  return false;
}

function bound(ball) {
  const { radius } = ball;
  if (ball.x < left + radius) {
    ball.x = left + radius;
    ball.vx = Math.max(0, -ball.vx * .21);
  } else if (ball.x > right - radius) {
    ball.x = right - radius;
    ball.vx = Math.min(0, -ball.vx * .21);
  }
  if (ball.y > floor - radius) {
    ball.y = floor - radius;
    ball.vy = ball.vy > 50 ? -ball.vy * .17 : Math.min(0, ball.vy);
    ball.vx *= .971;
    ball.contacted = true;
  }
  if (ball.y < radius) {
    ball.y = radius;
    ball.vy = Math.max(0, ball.vy);
  }
}

function collide(a, b, distance, dx, dy, overlap) {
  const nx = distance > .001 ? dx / distance : 1;
  const ny = distance > .001 ? dy / distance : 0;
  const mass = a.invMass + b.invMass;
  const correction = Math.max(0, overlap - .025) * .87 / mass;
  a.x -= nx * correction * a.invMass;
  a.y -= ny * correction * a.invMass;
  b.x += nx * correction * b.invMass;
  b.y += ny * correction * b.invMass;
  a.contacted = b.contacted = true;

  const vx = b.vx - a.vx;
  const vy = b.vy - a.vy;
  const normal = vx * nx + vy * ny;
  if (normal >= 0) return;
  const bounce = normal < -105 ? .17 : 0;
  const force = -normal * (1 + bounce) / mass;
  const tangent = vx * -ny + vy * nx;
  const friction = clamp(-tangent / mass, -force * .15, force * .15);
  const ix = force * nx - friction * ny;
  const iy = force * ny + friction * nx;
  a.vx -= ix * a.invMass;
  a.vy -= iy * a.invMass;
  b.vx += ix * b.invMass;
  b.vy += iy * b.invMass;
}

function advance() {
  roundTick++;
  if (isDailyMode() && roundTick >= maxTicks) {
    finishDailyAtLimit();
    return;
  }
  cooldown = Math.max(0, cooldown - step);
  for (const ball of balls) {
    ball.age += step;
    ball.vy = Math.min(ball.vy + 1010 * step, 690);
    ball.vx *= .999;
    ball.x += ball.vx * step;
    ball.y += ball.vy * step;
    ball.spin += (ball.vx / ball.radius - ball.spin) * .072;
    ball.rotation = clamp((ball.rotation + ball.spin * step) * .997, -.95, .95);
    bound(ball);
  }
  contacts: for (let iteration = 0; iteration < 6; iteration++) {
    const count = balls.length;
    for (let i = 0; i < count; i++) {
      const a = balls[i];
      if (a.dead) continue;
      for (let j = i + 1; j < count; j++) {
        const b = balls[j];
        if (b.dead) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const size = a.radius + b.radius;
        const distance2 = dx * dx + dy * dy;
        if (distance2 >= size * size) continue;
        if (a.level === b.level) {
          if (merge(a, b)) break contacts;
          break;
        }
        const distance = Math.sqrt(distance2);
        collide(a, b, distance, dx, dy, size - distance);
      }
      if (!a.dead) bound(a);
    }
  }
  if (balls.some(ball => ball.dead)) balls = balls.filter(ball => !ball.dead);
  const limit = dangerLine(drops);
  for (const ball of balls) {
    const parked = ball.contacted && ball.age > .65 && Math.hypot(ball.vx, ball.vy) < 85;
    ball.danger = ball.y - ball.radius < limit && parked
      ? ball.danger + step : Math.max(0, ball.danger - 2 * step);
    if (ball.danger > dangerSeconds) {
      showResult();
      break;
    }
  }
  for (const particle of particles) {
    particle.life -= step;
    particle.x += particle.vx * step;
    particle.y += particle.vy * step;
    particle.vy += 85 * step;
  }
  if (particles.some(particle => particle.life <= 0)) particles = particles.filter(particle => particle.life > 0);
}

function showResult() {
  state = coins > 0 ? "revive" : "playing";
  if (state === "revive") {
    $("result-title").textContent = "越过警戒线了";
    $("result-message").textContent = "本局 " + number.format(score) + " 分。可以移除伸出警戒线的角色，继续本局。";
    $("revive").hidden = $("finish").hidden = false;
    $("end-rank").hidden = $("play-again").hidden = true;
  } else {
    finish();
  }
  if (!result.open) result.showModal();
}

function finish() {
  if (state === "ended") return;
  if (dailySession) {
    if (state === "revive") recordDailyAction("f");
    state = "ended";
    finishDaily();
    return;
  }
  state = "ended";
  profile.scores.push({ name: profile.name.trim() || "香菜路人", score });
  profile.scores.sort((a, b) => b.score - a.score);
  profile.scores = profile.scores.slice(0, 20);
  saveProfile();
  $("result-title").textContent = "本局结束";
  $("result-message").textContent = "本局 " + number.format(score) + " 分 · 个人纪录 " + number.format(profile.best) + " 分";
  $("revive").hidden = $("finish").hidden = true;
  $("end-rank").hidden = $("play-again").hidden = false;
  if (result.open) $("play-again").focus();
}

function revive() {
  if (state !== "revive" || coins <= 0) return;
  wakeSound();
  recordDailyAction("r");
  coins--;
  const limit = dangerLine(drops);
  balls = balls.filter(ball => {
    if (ball.y - ball.radius >= limit) {
      ball.danger = 0;
      return true;
    }
    burst(ball.x, ball.y, levels[ball.level].accent, 14);
    return false;
  });
  state = "playing";
  cooldown = .22;
  result.close();
  updateHud();
  playSound(670, .26);
}

const backdrop = document.createElement("canvas");
backdrop.width = canvas.width;
backdrop.height = canvas.height;
const backdropContext = backdrop.getContext("2d");
backdropContext.scale(2, 2);
const bg = backdropContext.createLinearGradient(0, 0, 0, height);
bg.addColorStop(0, "#edf4e8");
bg.addColorStop(1, "#e5ebdb");
backdropContext.fillStyle = bg;
backdropContext.fillRect(0, 0, width, height);
backdropContext.strokeStyle = "#46654518";
backdropContext.lineWidth = 1;
for (let x = 20; x < width; x += 20) {
  backdropContext.beginPath();
  backdropContext.moveTo(x + .5, 0);
  backdropContext.lineTo(x + .5, floor);
  backdropContext.stroke();
}
for (let y = 20; y < height; y += 20) {
  backdropContext.beginPath();
  backdropContext.moveTo(0, y + .5);
  backdropContext.lineTo(width, y + .5);
  backdropContext.stroke();
}
for (let i = 0; i < 53; i++) {
  const x = (i * i * 71 + 17) % width;
  const y = (i * i * 17 + 89) % height;
  circle(backdropContext, x, y, i % 9 === 0 ? 1.2 : .62);
  backdropContext.fillStyle = i % 9 === 0 ? "#61866366" : "#6186633d";
  backdropContext.fill();
}
backdropContext.fillStyle = "#a3b399";
backdropContext.fillRect(0, floor, width, height - floor);

function render(now = 0) {
  const ctx = context;
  const line = dangerLine(drops);
  const checking = inspectionRemaining(drops) > 0;
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.drawImage(backdrop, 0, 0, width, height);
  const dangerProgress = balls.reduce((maximum, ball) => Math.max(maximum, ball.danger), 0) / dangerSeconds;
  const danger = dangerProgress > .08;
  if (danger) {
    ctx.fillStyle = "#bc68421d";
    ctx.fillRect(0, 0, width, line);
  }
  ctx.strokeStyle = danger || checking ? "#a74833" : "#a8664aa6";
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(left, line + .5);
  ctx.lineTo(right, line + .5);
  ctx.stroke();
  ctx.setLineDash([]);
  if (danger) {
    ctx.fillStyle = "#a74833";
    ctx.fillRect(left, line - 2, (right - left) * clamp(dangerProgress, 0, 1), 3);
  }
  ctx.font = '11px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = "#89573f";
  ctx.fillText(checking ? "突击检查线" : "警戒线", 14, line - 8);
  if (drops === 0) {
    ctx.save();
    ctx.globalAlpha = .13;
    paintPiece(ctx, cilantroLevel, width / 2, 279, 78);
    ctx.restore();
  }
  if (state === "playing" && !removalMode) {
    const r = levels[shownLevel].radius;
    const x = clamp(aim, left + r, right - r);
    const target = balls.reduce((y, ball) => {
      const dx = ball.x - x;
      const radius = ball.radius + r;
      return Math.abs(dx) < radius ? Math.min(y, ball.y - Math.sqrt(radius * radius - dx * dx)) : y;
    }, floor - r);
    ctx.strokeStyle = "#55795d8a";
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    const y = Math.max(spawnY, r + 3);
    ctx.moveTo(x, y + r + 4);
    ctx.lineTo(x, Math.max(y + r + 4, target));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = cooldown > 0 ? .45 : 1;
    paintPiece(ctx, shownLevel, x, y, r);
    ctx.globalAlpha = 1;
  }
  for (const ball of balls) {
    paintPiece(ctx, ball.level, ball.x, ball.y, ball.radius, ball.rotation, now / 1000);
  }
  if (removalMode && removalTarget) {
    circle(ctx, removalTarget.x, removalTarget.y, removalTarget.radius + 3);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#2f7850";
    ctx.stroke();
  }
  for (const particle of particles) {
    ctx.globalAlpha = particle.life / particle.max;
    ctx.fillStyle = particle.color;
    circle(ctx, particle.x, particle.y, 2.1);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function frame(now) {
  if (!previous) previous = now;
  const elapsed = Math.min(.05, (now - previous) / 1000);
  previous = now;
  if (state === "playing" && !rank.open && !$("daily-rank").open && !removalMode) {
    accumulator += elapsed;
    while (accumulator >= step && state === "playing") {
      advance();
      accumulator -= step;
    }
  } else {
    accumulator = 0;
  }
  render(now);
  requestAnimationFrame(frame);
}

function position(event) {
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * width / rect.width;
  if (!removalMode) {
    aim = x;
    return null;
  }
  const y = (event.clientY - rect.top) * height / rect.height;
  return balls.findLast(ball => (ball.x - x) ** 2 + (ball.y - y) ** 2 <= ball.radius ** 2) ?? null;
}

canvas.addEventListener("pointerdown", event => {
  if (event.button !== 0 || playerId !== null || state !== "playing") return;
  wakeSound();
  playerId = event.pointerId;
  const target = position(event);
  if (removalMode) removalTarget = target;
  canvas.setPointerCapture(playerId);
});
canvas.addEventListener("pointermove", event => {
  if (playerId === event.pointerId || (playerId === null && event.pointerType === "mouse")) {
    const target = position(event);
    if (removalMode) removalTarget = target;
  }
});
canvas.addEventListener("pointerup", event => {
  if (playerId !== event.pointerId) return;
  const target = position(event);
  playerId = null;
  if (removalMode) removePiece(target);
  else drop();
});
for (const type of ["pointercancel", "lostpointercapture"]) {
  canvas.addEventListener(type, event => {
    if (playerId === event.pointerId) playerId = null;
  });
}

ticketButton.addEventListener("click", () => {
  if (state === "playing" && tickets > 0 && balls.length > 0 && playerId === null) {
    setRemovalMode(!removalMode);
  }
});

document.addEventListener("keydown", event => {
  if (event.ctrlKey || event.altKey || event.metaKey || rank.open || result.open || $("daily-rank").open) return;
  const key = event.key.toLowerCase();
  if (removalMode && key === "escape") {
    event.preventDefault();
    setRemovalMode(false);
    return;
  }
  if (event.target.closest?.("input, button")) return;
  if (removalMode) {
    if (!["arrowleft", "arrowright", " ", "enter"].includes(key)) return;
    event.preventDefault();
    if (key === "arrowleft" || key === "arrowright") selectRemovalTarget(key === "arrowleft" ? -1 : 1);
    else if (!event.repeat) removePiece(removalTarget);
    return;
  }
  if (!["arrowleft", "arrowright", " ", "enter", "r"].includes(key)) return;
  event.preventDefault();
  if (key === "r" && !event.repeat) startRegular();
  if ((key === " " || key === "enter") && !event.repeat) drop();
  if (key === "arrowleft") aim = clamp(aim - 12, left, right);
  if (key === "arrowright") aim = clamp(aim + 12, left, right);
});

function showRank() {
  if (rank.open) return;
  if (removalMode) setRemovalMode(false);
  $("name").value = profile.name;
  $("rankings").replaceChildren();
  profile.scores.forEach((entry, index) => {
    const item = document.createElement("li");
    const place = document.createElement("span");
    const name = document.createElement("span");
    const value = document.createElement("strong");
    place.textContent = String(index + 1).padStart(2, "0");
    name.textContent = entry.name;
    value.textContent = number.format(entry.score);
    item.append(place, name, value);
    $("rankings").append(item);
  });
  $("empty-rank").hidden = profile.scores.length > 0;
  rank.showModal();
  rank.querySelector("button").focus();
}

function isDailyMode() { return dailySession !== null; }

function recordDailyAction(kind, value) {
  if (!dailySession || dailySession.actions.length > maxActions) return;
  const action = [roundTick, kind];
  if (value !== undefined) action.push(value);
  dailySession.actions.push(action);
}

function startRegular() {
  dailySession = null;
  $("end-rank").textContent = "排行榜";
  document.querySelector(".header-note").textContent = "两两相碰，合成香菜";
  reset();
}

async function dailyRequest(path, body) {
  const options = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
  const response = await fetch(dailyApi + path, options);
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    throw new Error(detail.error || "今日榜暂时不可用");
  }
  return response.json();
}

async function showDailyBoard() {
  const dialog = $("daily-rank");
  if (removalMode) setRemovalMode(false);
  if (!dialog.open) {
    $("daily-name").value = profile.name;
    try { $("daily-name").value = localStorage.getItem("cilantro-daily-name") || profile.name; } catch {}
    dialog.showModal();
  }
  $("daily-notice").textContent = "正在加载今日榜…";
  $("daily-entries").replaceChildren();
  try {
    const { day, entries } = await dailyRequest("/board");
    $("daily-notice").textContent = day + "（北京时间） · " +
      (entries.length ? "同一投放顺序，每人取最高分" : "还没有人成绩上榜") + "。开始挑战即同意公开昵称和成绩。";
    for (const entry of entries) {
      const item = document.createElement("li");
      item.textContent = entry.name + " · " + number.format(entry.score) + " 分";
      $("daily-entries").append(item);
    }
  } catch (error) {
    $("daily-notice").textContent = error.message;
  }
}

async function startDaily() {
  const button = $("daily-start");
  const name = $("daily-name").value.trim().normalize("NFC") || "香菜路人";
  if (name.length > 18 || /[\p{Cc}\p{Cf}]/u.test(name)) {
    $("daily-notice").textContent = "昵称须为 1–18 个可见字符。";
    return;
  }
  button.disabled = true;
  let player = "";
  try { player = localStorage.getItem("cilantro-daily-player") || ""; } catch {}
  try {
    const opened = await dailyRequest("/start", { player, rulesVersion });
    try {
      localStorage.setItem("cilantro-daily-player", opened.player);
      localStorage.setItem("cilantro-daily-name", name);
    } catch {}
    dailySession = { ...opened, name, actions: [] };
    $("daily-rank").close();
    $("end-rank").textContent = "今日榜";
    document.querySelector(".header-note").textContent = "每日同题 · " + opened.day;
    reset();
  } catch (error) {
    $("daily-notice").textContent = error.message;
  } finally {
    button.disabled = false;
  }
}

function finishDailyAtLimit() {
  finish();
}

async function finishDaily() {
  const session = dailySession;
  const message = $("result-message");
  const summary = "本局 " + number.format(score) + " 分";
  $("result-title").textContent = "每日挑战结束";
  $("revive").hidden = $("finish").hidden = true;
  $("end-rank").hidden = $("play-again").hidden = false;
  if (!result.open) result.showModal();
  message.textContent = summary + " · 正在校验";
  try {
    if (session.actions.length > maxActions) throw new Error("本局操作数超过榜单上限");
    await dailyRequest("/submit", { run: session.run, actions: session.actions, tick: roundTick, name: session.name, score });
    if (dailySession === session) message.textContent = summary + " · 已提交今日榜";
  } catch (error) {
    if (dailySession === session) message.textContent = summary + " · " + error.message;
  }
}

$("name").addEventListener("input", event => {
  profile.name = event.target.value;
  saveProfile();
});
$("name").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.isComposing) rank.close();
});
$("show-rank").addEventListener("click", showRank);
$("end-rank").addEventListener("click", () => isDailyMode() ? showDailyBoard() : showRank());
$("play-again").addEventListener("click", startRegular);
$("reset").addEventListener("click", startRegular);
$("revive").addEventListener("click", revive);
$("finish").addEventListener("click", finish);
result.addEventListener("cancel", event => event.preventDefault());
$("sound").addEventListener("click", () => {
  profile.sound = !profile.sound;
  if (profile.sound) wakeSound();
  updateSound();
  saveProfile();
});
if (dailyApi) {
  for (const id of ["daily-mode", "daily-board"]) {
    $(id).hidden = false;
    $(id).addEventListener("click", showDailyBoard);
  }
  $("daily-start").addEventListener("click", startDaily);
}
updateSound();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
