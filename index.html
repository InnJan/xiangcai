<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eff1e6">
<meta name="robots" content="noindex, nofollow">
<title>合成大香菜</title>
<style>
:root {
  color-scheme: light;
  --bg: #eff1e6;
  --panel: #fafaf2;
  --edge: #d2d9c7;
  --ink: #223326;
  --muted: #506052;
  --mint: #285c3e;
  --peach: #88542c;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100svh; color: var(--ink);
  background: radial-gradient(ellipse at 55% 0%, #e1ead8 0, transparent 55%), var(--bg);
}
button, input { font: inherit; }
button {
  border: 1px solid var(--edge); border-radius: 9px; color: var(--ink);
  background: #f0f3e8; padding: 10px 12px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
button:hover { background: #dfe9d9; border-color: #7f9d83; }
button:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
button.primary { background: var(--mint); color: #fcfff7; border-color: var(--mint); font-weight: 750; }
button.primary:hover { background: #377652; }
[hidden] { display: none !important; }
.shell { max-width: 875px; margin: auto; padding: 32px 22px 28px; }
header { display: flex; align-items: end; justify-content: space-between; gap: 12px; padding-bottom: 19px; }
.brand { display: flex; align-items: center; gap: 14px; }
.emblem { flex: none; width: 39px; height: 39px; position: relative; border-radius: 50%; border: 1px solid #83a385; background: #deead9; }
.emblem::before, .emblem::after { content: ""; position: absolute; background: #39794d; }
.emblem::before { width: 27%; height: 52%; left: 28%; top: 23%; border-radius: 90% 10%; transform: rotate(-25deg); }
.emblem::after { width: 36%; height: 42%; left: 46%; top: 20%; border-radius: 90% 10%; transform: rotate(23deg); }
h1 { margin: 0; font-size: clamp(29px, 5vw, 45px); line-height: 1; letter-spacing: .05em; }
.header-note { color: var(--muted); font-size: 13px; margin: 0 0 2px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 235px; gap: 15px; align-items: start; }
.stage, .tile { border: 1px solid var(--edge); border-radius: 15px; background: var(--panel); }
.stage { padding: 12px; }
.hud { display: flex; justify-content: space-between; gap: 8px; padding: 1px 3px 11px; align-items: center; }
.stats { display: flex; gap: clamp(12px, 4vw, 35px); }
.stat span, .next span { display: block; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
.stat strong { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.12; margin-top: 4px; }
.stat:first-child strong { color: var(--mint); }
.next { display: flex; align-items: center; gap: 5px; }
.next canvas { display: block; width: 38px; height: 38px; }
.board { position: relative; background: #edf3e9; border: 1px solid #a0b197; border-radius: 10px; overflow: hidden; }
#field { display: block; width: 100%; aspect-ratio: 440 / 478; touch-action: none; cursor: crosshair; }
#field:focus-visible { outline-offset: -4px; }
.board-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 2px 0; color: var(--muted); font-size: 12px; }
#coins { color: var(--peach); font-variant-numeric: tabular-nums; white-space: nowrap; }
aside { display: grid; gap: 12px; }
.tile { padding: 15px; }
.tile h2 { font-size: 14px; margin: 0 0 9px; }
.tile p { color: var(--muted); font-size: 12px; line-height: 1.65; margin: 8px 0 0; }
.evolution { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.evolution canvas:last-child { background: #dcead4; border-color: #91ac87; }
.evolution canvas { width: 100%; aspect-ratio: 1; min-width: 0; background: #e8efe2; border: 1px solid #d9e2d2; border-radius: 8px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tools button { font-size: 12px; padding: 9px 4px; }
.tools button:first-child { grid-column: 1 / -1; }
kbd { border: 1px solid #acb9a7; padding: 0 4px; border-radius: 3px; font: inherit; white-space: nowrap; }
.keys { color: var(--muted); line-height: 1.7; font-size: 12px; }
dialog {
  color: var(--ink); background: #fafbf3; border: 1px solid #acbca5; border-radius: 16px;
  padding: 22px; width: min(92vw, 390px); max-height: 88dvh; box-shadow: 0 24px 80px #0008;
}
dialog::backdrop { background: #1b2923a8; }
dialog h2 { margin: 0 0 13px; font-size: 23px; }
dialog p { color: var(--muted); line-height: 1.6; }
.dialog-actions { display: flex; flex-wrap: wrap; justify-content: end; gap: 8px; margin-top: 16px; }
#name { width: 100%; border: 1px solid var(--edge); border-radius: 7px; padding: 8px 10px; background: #ffffff; color: var(--ink); margin-top: 6px; }
#rankings { list-style: none; padding: 0; margin: 13px 0 0; }
#rankings li { display: grid; grid-template-columns: 27px 1fr auto; gap: 7px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--edge); font-size: 13px; }
#rankings li span:nth-child(2) { overflow-wrap: anywhere; }
#rankings li strong { color: var(--mint); font-variant-numeric: tabular-nums; }
@media (max-width: 650px) {
  .shell { padding: max(13px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom)); max-width: 498px; }
  header { padding: 0 1px 12px; align-items: center; }
  .brand { gap: 8px; }
  .emblem { width: 29px; height: 29px; }
  .header-note { font-size: 11px; text-align: right; }
  .layout { grid-template-columns: 1fr; gap: 7px; }
  .stage { padding: 7px; border-radius: 11px; }
  .hud { padding: 0 2px 6px; }
  .stat strong { font-size: 19px; margin-top: 2px; }
  .next canvas { width: 32px; height: 32px; }
  .board-meta { padding-top: 6px; font-size: 11px; }
  aside { gap: 7px; }
  .tile { padding: 9px; border-radius: 10px; }
  .tools { order: -1; grid-template-columns: 1.3fr 1fr 1fr; gap: 5px; padding: 5px; }
  .tools button:first-child { grid-column: auto; }
  .evolution { grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .evolution canvas { border-radius: 5px; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand"><div class="emblem" aria-hidden="true"></div><h1>合成大香菜</h1></div>
    <p class="header-note">两两相碰，合成香菜</p>
  </header>
  <div class="layout">
    <section class="stage" aria-label="游戏">
      <div class="hud">
        <div class="stats">
          <div class="stat"><span>本局得分</span><strong id="score">0</strong></div>
          <div class="stat"><span>个人纪录</span><strong id="best">0</strong></div>
        </div>
        <div class="next"><span>下一个</span><canvas id="next" width="80" height="80"></canvas></div>
      </div>
      <div class="board">
        <canvas id="field" width="880" height="956" tabindex="0" aria-label="棋盘，方向键瞄准，空格投放" aria-describedby="hint"></canvas>
      </div>
      <div class="board-meta"><span id="hint">拖动瞄准 · 松手投放</span><span id="coins" aria-live="polite">复活币 × 0</span></div>
    </section>
    <aside aria-label="游戏选项">
      <section class="tile">
        <h2>合成顺序</h2>
        <div id="evolution" class="evolution"></div>
        <p>每 2,000 分获得一枚复活币。两份香菜相撞会消除彼此，并奖励 500 分和一枚复活币。</p>
      </section>
      <div class="tile tools">
        <button id="show-rank" type="button">本机排行榜</button>
        <button id="sound" type="button" aria-pressed="true">音效开启</button>
        <button id="reset" type="button">重新开始</button>
      </div>
      <div class="tile keys"><kbd>←</kbd> <kbd>→</kbd> 瞄准　<kbd>空格</kbd> 投放</div>
    </aside>
  </div>
</main>
<dialog id="result" aria-labelledby="result-title">
  <h2 id="result-title">本局结束</h2>
  <p id="result-message"></p>
  <div class="dialog-actions">
    <button id="end-rank" type="button">排行榜</button>
    <button id="finish" type="button" hidden>结算</button>
    <button id="revive" class="primary" type="button" hidden>消耗一枚复活币</button>
    <button id="play-again" class="primary" type="button">再来一局</button>
  </div>
</dialog>
<dialog id="rank" aria-labelledby="rank-title">
  <h2 id="rank-title">本机排行榜</h2>
  <label for="name">下局结算昵称</label>
  <input id="name" type="text" maxlength="18" placeholder="香菜路人" autocomplete="off">
  <ol id="rankings"></ol>
  <p id="empty-rank">完成一局后，成绩会显示在这里。</p>
  <form method="dialog" class="dialog-actions"><button class="primary">关闭</button></form>
</dialog>

function loadProfile() {
  const fallback = { name: "", best: 0, scores: [], sound: true };
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (!saved || typeof saved !== "object") return fallback;
    return {
      name: typeof saved.name === "string" ? saved.name.slice(0, 18) : "",
      best: Number.isSafeInteger(saved.best) && saved.best >= 0 ? saved.best : 0,
      scores: Array.isArray(saved.scores) ? saved.scores.filter(entry =>
        entry && typeof entry.name === "string" && Number.isSafeInteger(entry.score) && entry.score >= 0
      ).slice(0, 20) : [],
      sound: saved.sound !== false
    };
  } catch {
    return fallback;
  }
}

const profile = loadProfile();
function saveProfile() {
  try { localStorage.setItem(storageKey, JSON.stringify(profile)); } catch {}
}

function circle(ctx, x, y, radius) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
}

function paintPiece(ctx, level, x, y, radius, rotation = 0) {
  const piece = levels[level];
  const image = sprites[level];
  const r = radius * .98;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  circle(ctx, 0, 0, r);
  ctx.fillStyle = "#fafbf6";
  ctx.fill();
  if (image.complete && image.naturalWidth > 0) {
    ctx.save();
    ctx.clip();
    ctx.drawImage(image, -r, -r, r * 2, r * 2);
    ctx.restore();
  }
  ctx.strokeStyle = piece.accent;
  ctx.lineWidth = Math.max(1.05, r * .042);
  ctx.stroke();
  ctx.restore();
}

function drawIcon(icon, level) {
  const ctx = icon.getContext("2d");
  const size = icon.width;
  ctx.clearRect(0, 0, size, size);
  paintPiece(ctx, level, size / 2, size / 2, size * .43);
}

const guideIcons = levels.map((piece, level) => {
  const icon = document.createElement("canvas");
  icon.width = icon.height = 70;
  const title = (level + 1) + "级 · " + piece.name;
  icon.title = title;
  icon.setAttribute("role", "img");
  icon.setAttribute("aria-label", title);
  $("evolution").append(icon);
  return icon;
});

const sprites = levels.map((piece, level) => {
  const image = new Image();
  image.addEventListener("load", () => {
    drawIcon(guideIcons[level], level);
    if (level === nextLevel) drawIcon(nextCanvas, level);
  });
  image.src = piece.photo;
  return image;
});
guideIcons.forEach(drawIcon);

let audio;
function wakeSound() {
  if (!profile.sound) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    audio ??= new Audio();
    if (audio.state === "suspended") audio.resume().catch(() => {});
  } catch {}
}

function playSound(frequency, time, volume = .07) {
  if (!profile.sound || audio?.state !== "running") return;
  const tone = audio.createOscillator();
  const gain = audio.createGain();
  const now = audio.currentTime;
  tone.type = "sine";
  tone.frequency.setValueAtTime(frequency, now);
  tone.frequency.exponentialRampToValueAtTime(frequency * .66, now + time);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(.001, now + time);
  tone.connect(gain);
  gain.connect(audio.destination);
  tone.start(now);
  tone.stop(now + time);
}

function updateSound() {
  $("sound").textContent = profile.sound ? "音效开启" : "音效关闭";
  $("sound").setAttribute("aria-pressed", String(profile.sound));
}

let balls, particles, score, coins, shownLevel, nextLevel, aim, cooldown, state, drops;
let playerId = null;
let previous = 0;
let accumulator = 0;
const number = new Intl.NumberFormat("zh-CN");

function randomLevel() {
  const value = Math.random();
  if (value < .36) return 0;
  if (value < .65) return 1;
  if (value < .86) return 2;
  return 3;
}

function updateHud() {
  $("score").textContent = number.format(score);
  $("best").textContent = number.format(profile.best);
  $("coins").textContent = "复活币 × " + coins;
}

function reset() {
  if (result.open) result.close();
  balls = [];
  particles = [];
  score = coins = cooldown = drops = 0;
  shownLevel = randomLevel();
  nextLevel = randomLevel();
  aim = width / 2;
  state = "playing";
  playerId = null;
  updateHud();
  drawIcon(nextCanvas, nextLevel);
  nextCanvas.setAttribute("aria-label", "下一个：" + levels[nextLevel].name);
}

function addScore(points) {
  coins += Math.floor((score + points) / reviveInterval) - Math.floor(score / reviveInterval);
  score += points;
  if (score > profile.best) {
    profile.best = score;
    saveProfile();
  }
  updateHud();
}

function makeBall(level, x, y, vx = 0, vy = 0) {
  const radius = levels[level].radius;
  return {
    level, x, y, vx, vy, radius, invMass: 1 / (radius * radius),
    rotation: (Math.random() - .5) * .22, spin: 0, age: 0, danger: 0, contacted: false, dead: false
  };
}

function drop() {
  if (state !== "playing" || rank.open || cooldown > 0) return;
  wakeSound();
  const radius = levels[shownLevel].radius;
  balls.push(makeBall(shownLevel, clamp(aim, left + radius, right - radius), spawnY, 0, 42));
  shownLevel = nextLevel;
  nextLevel = randomLevel();
  drawIcon(nextCanvas, nextLevel);
  nextCanvas.setAttribute("aria-label", "下一个：" + levels[nextLevel].name);
  cooldown = .32;
  drops++;
  playSound(225, .10, .035);
}

function burst(x, y, color, size) {
  if (reducedMotion) return;
  for (let i = 0; i < size; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const speed = 26 + Math.random() * 120;
    const life = .35 + Math.random() * .36;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life, max: life, color });
  }
}

function merge(a, b) {
  a.dead = b.dead = true;
  const x = (a.x + b.x) / 2;
  const y = (a.y + b.y) / 2;
  const level = a.level + 1;
  if (level === levels.length) {
    coins++;
    addScore(finalPairPoints);
    burst(x, y, levels[a.level].accent, 40);
    playSound(850, .34, .13);
    return;
  }
  const merged = makeBall(level, x, y, (a.vx + b.vx) * .28, Math.min(10, (a.vy + b.vy) * .28));
  merged.contacted = true;
  merged.age = .34;
  balls.push(merged);
  addScore(levels[level].points);
  burst(x, y, levels[level].accent, 14);
  playSound(400 + level * 54, .17);
}

function bound(ball) {
  const { radius } = ball;
  if (ball.x < left + radius) {
    ball.x = left + radius;
    ball.vx = Math.max(0, -ball.vx * .21);
  } else if (ball.x > right - radius) {
    ball.x = right - radius;
    ball.vx = Math.min(0, -ball.vx * .21);
  }
  if (ball.y > floor - radius) {
    ball.y = floor - radius;
    ball.vy = ball.vy > 50 ? -ball.vy * .17 : Math.min(0, ball.vy);
    ball.vx *= .971;
    ball.contacted = true;
  }
  if (ball.y < radius) {
    ball.y = radius;
    ball.vy = Math.max(0, ball.vy);
  }
}

function collide(a, b, distance, dx, dy, overlap) {
  const nx = distance > .001 ? dx / distance : 1;
  const ny = distance > .001 ? dy / distance : 0;
  const mass = a.invMass + b.invMass;
  const correction = Math.max(0, overlap - .025) * .87 / mass;
  a.x -= nx * correction * a.invMass;
  a.y -= ny * correction * a.invMass;
  b.x += nx * correction * b.invMass;
  b.y += ny * correction * b.invMass;
  a.contacted = b.contacted = true;

  const vx = b.vx - a.vx;
  const vy = b.vy - a.vy;
  const normal = vx * nx + vy * ny;
  if (normal >= 0) return;
  const bounce = normal < -105 ? .17 : 0;
  const force = -normal * (1 + bounce) / mass;
  const tangent = vx * -ny + vy * nx;
  const friction = clamp(-tangent / mass, -force * .15, force * .15);
  const ix = force * nx - friction * ny;
  const iy = force * ny + friction * nx;
  a.vx -= ix * a.invMass;
  a.vy -= iy * a.invMass;
  b.vx += ix * b.invMass;
  b.vy += iy * b.invMass;
}

function advance() {
  cooldown = Math.max(0, cooldown - step);
  for (const ball of balls) {
    ball.age += step;
    ball.vy = Math.min(ball.vy + 1010 * step, 690);
    ball.vx *= .999;
    ball.x += ball.vx * step;
    ball.y += ball.vy * step;
    ball.spin += (ball.vx / ball.radius - ball.spin) * .072;
    ball.rotation = clamp((ball.rotation + ball.spin * step) * .997, -.95, .95);
    bound(ball);
  }
  for (let iteration = 0; iteration < 6; iteration++) {
    const count = balls.length;
    for (let i = 0; i < count; i++) {
      const a = balls[i];
      if (a.dead) continue;
      for (let j = i + 1; j < count; j++) {
        const b = balls[j];
        if (b.dead) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const size = a.radius + b.radius;
        const distance2 = dx * dx + dy * dy;
        if (distance2 >= size * size) continue;
        if (a.level === b.level) {
          merge(a, b);
          break;
        }
        const distance = Math.sqrt(distance2);
        collide(a, b, distance, dx, dy, size - distance);
      }
      if (!a.dead) bound(a);
    }
  }
  if (balls.some(ball => ball.dead)) balls = balls.filter(ball => !ball.dead);
  for (const ball of balls) {
    const parked = ball.contacted && ball.age > .65 && Math.hypot(ball.vx, ball.vy) < 85;
    ball.danger = ball.y - ball.radius < line && parked
      ? ball.danger + step : Math.max(0, ball.danger - 2 * step);
    if (ball.danger > dangerSeconds) {
      showResult();
      break;
    }
  }
  for (const particle of particles) {
    particle.life -= step;
    particle.x += particle.vx * step;
    particle.y += particle.vy * step;
    particle.vy += 85 * step;
  }
  if (particles.some(particle => particle.life <= 0)) particles = particles.filter(particle => particle.life > 0);
}

function showResult() {
  state = coins > 0 ? "revive" : "playing";
  if (state === "revive") {
    $("result-title").textContent = "越过警戒线了";
    $("result-message").textContent = "本局 " + number.format(score) + " 分。可以移除伸出警戒线的角色，继续本局。";
    $("revive").hidden = $("finish").hidden = false;
    $("end-rank").hidden = $("play-again").hidden = true;
  } else {
    finish();
  }
  if (!result.open) result.showModal();
}

function finish() {
  if (state === "ended") return;
  state = "ended";
  profile.scores.push({ name: profile.name.trim() || "香菜路人", score });
  profile.scores.sort((a, b) => b.score - a.score);
  profile.scores = profile.scores.slice(0, 20);
  saveProfile();
  $("result-title").textContent = "本局结束";
  $("result-message").textContent = "本局 " + number.format(score) + " 分 · 个人纪录 " + number.format(profile.best) + " 分";
  $("revive").hidden = $("finish").hidden = true;
  $("end-rank").hidden = $("play-again").hidden = false;
  if (result.open) $("play-again").focus();
}

function revive() {
  if (state !== "revive" || coins <= 0) return;
  wakeSound();
  coins--;
  balls = balls.filter(ball => {
    if (ball.y - ball.radius >= line) {
      ball.danger = 0;
      return true;
    }
    burst(ball.x, ball.y, levels[ball.level].accent, 14);
    return false;
  });
  state = "playing";
  cooldown = .22;
  result.close();
  updateHud();
  playSound(670, .26);
}

  backdropContext.stroke();
}
for (let y = 20; y < height; y += 20) {
  backdropContext.beginPath();
  backdropContext.moveTo(0, y + .5);
  backdropContext.lineTo(width, y + .5);
  backdropContext.stroke();
}
for (let i = 0; i < 53; i++) {
  const x = (i * i * 71 + 17) % width;
  const y = (i * i * 17 + 89) % height;
  circle(backdropContext, x, y, i % 9 === 0 ? 1.2 : .62);
  backdropContext.fillStyle = i % 9 === 0 ? "#61866366" : "#6186633d";
  backdropContext.fill();
}
backdropContext.fillStyle = "#a3b399";
backdropContext.fillRect(0, floor, width, height - floor);

function render() {
  const ctx = context;
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.drawImage(backdrop, 0, 0, width, height);
  const danger = balls.some(ball => ball.danger > .12);
  if (danger) {
    ctx.fillStyle = "#bc68421d";
    ctx.fillRect(0, 0, width, line);
  }
  ctx.strokeStyle = danger ? "#a74833" : "#a8664aa6";
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(left, line + .5);
  ctx.lineTo(right, line + .5);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '11px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = "#89573f";
  ctx.fillText("警戒线", 14, line - 8);
  if (drops === 0) {
    ctx.save();
    ctx.globalAlpha = .13;
    paintPiece(ctx, levels.length - 1, width / 2, 279, 78);
    ctx.restore();
  }
  if (state === "playing") {
    const r = levels[shownLevel].radius;
    const x = clamp(aim, left + r, right - r);
    const target = balls.reduce((y, ball) => {
      const dx = ball.x - x;
      const radius = ball.radius + r;
      return Math.abs(dx) < radius ? Math.min(y, ball.y - Math.sqrt(radius * radius - dx * dx)) : y;
    }, floor - r);
    ctx.strokeStyle = "#55795d8a";
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.moveTo(x, spawnY + r + 4);
    ctx.lineTo(x, Math.max(spawnY + r + 4, target));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = cooldown > 0 ? .45 : 1;
    paintPiece(ctx, shownLevel, x, spawnY, r);
    ctx.globalAlpha = 1;
  }
  for (const ball of balls) {
    paintPiece(ctx, ball.level, ball.x, ball.y, ball.radius, ball.rotation);
  }
  for (const particle of particles) {
    ctx.globalAlpha = particle.life / particle.max;
    ctx.fillStyle = particle.color;
    circle(ctx, particle.x, particle.y, 2.1);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function frame(now) {
  if (!previous) previous = now;
  const elapsed = Math.min(.05, (now - previous) / 1000);
  previous = now;
  if (state === "playing" && !rank.open) {
    accumulator += elapsed;
    while (accumulator >= step && state === "playing") {
      advance();
      accumulator -= step;
    }
  } else {
    accumulator = 0;
  }
  render();
  requestAnimationFrame(frame);
}

function position(event) {
  const rect = canvas.getBoundingClientRect();
  aim = (event.clientX - rect.left) * width / rect.width;
}

canvas.addEventListener("pointerdown", event => {
  if (event.button !== 0 || playerId !== null || state !== "playing") return;
  wakeSound();
  playerId = event.pointerId;
  position(event);
  canvas.setPointerCapture(playerId);
});
canvas.addEventListener("pointermove", event => {
  if (playerId === event.pointerId || (playerId === null && event.pointerType === "mouse")) position(event);
});
canvas.addEventListener("pointerup", event => {
  if (playerId !== event.pointerId) return;
  position(event);
  playerId = null;
  drop();
});
for (const type of ["pointercancel", "lostpointercapture"]) {
  canvas.addEventListener(type, event => {
    if (playerId === event.pointerId) playerId = null;
  });
}

document.addEventListener("keydown", event => {
  if (event.ctrlKey || event.altKey || event.metaKey || rank.open || result.open ||
      event.target.closest?.("input, button")) return;
  const key = event.key.toLowerCase();
  if (!["arrowleft", "arrowright", " ", "enter", "r"].includes(key)) return;
  event.preventDefault();
  if (key === "r" && !event.repeat) reset();
  if ((key === " " || key === "enter") && !event.repeat) drop();
  if (key === "arrowleft") aim = clamp(aim - 12, left, right);
  if (key === "arrowright") aim = clamp(aim + 12, left, right);
});

function showRank() {
  if (rank.open) return;
  $("name").value = profile.name;
  $("rankings").replaceChildren();
  profile.scores.forEach((entry, index) => {
    const item = document.createElement("li");
    const place = document.createElement("span");
    const name = document.createElement("span");
    const value = document.createElement("strong");
    place.textContent = String(index + 1).padStart(2, "0");
    name.textContent = entry.name;
    value.textContent = number.format(entry.score);
    item.append(place, name, value);
    $("rankings").append(item);
  });
  $("empty-rank").hidden = profile.scores.length > 0;
  rank.showModal();
  rank.querySelector("button").focus();
}

$("name").addEventListener("input", event => {
  profile.name = event.target.value;
  saveProfile();
});
$("name").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.isComposing) rank.close();
});
$("show-rank").addEventListener("click", showRank);
$("end-rank").addEventListener("click", showRank);
$("play-again").addEventListener("click", reset);
$("reset").addEventListener("click", reset);
$("revive").addEventListener("click", revive);
$("finish").addEventListener("click", finish);
result.addEventListener("cancel", event => event.preventDefault());
$("sound").addEventListener("click", () => {
  profile.sound = !profile.sound;
  if (profile.sound) wakeSound();
  updateSound();
  saveProfile();
});
updateSound();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
